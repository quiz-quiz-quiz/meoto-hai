<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meoto杯 | クイズ大会</title>
  
  <!-- ★ファビコンの設定 -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Vue 3 & Vue Router CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4"></script>

  <style>
    /* =========================================
       共通設定・変数
    ========================================= */
    :root {
      --color-white: #ffffff;
      --color-text: #2c2c2c;
      --color-accent-red: #ff0000;
      --color-accent-gold: #b8a240;
      --color-border: #e0e0e0; 
    }
    body {
      margin: 0;
      font-family: 'Noto Serif JP', serif;
      color: var(--color-text);
      background-color: var(--color-white);
      line-height: 1.8;
      letter-spacing: 0.05em;
      overflow-x: hidden; 
    }
    a { color: inherit; text-decoration: none; transition: 0.2s; }
    h1, h2, h3, h4, h5, h6 { font-weight: 500; }
    
    /* Vueの読み込み前のチラつき防止 */
    [v-cloak] { display: none; }

    /* =========================================
       準備中（レビューコード）画面
    ========================================= */
    .auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .auth-screen h2 { font-size: 2rem; letter-spacing: 0.2em; margin-bottom: 10px; }
    .auth-screen p { margin-bottom: 30px; font-size: 0.95rem; color: #666; }
    .auth-input {
      padding: 12px; font-size: 1.2rem; text-align: center;
      border: 1px solid var(--color-border);
      outline: none; margin-bottom: 20px; letter-spacing: 0.1em;
      width: 200px;
    }
    .auth-input:focus { border-color: var(--color-accent-gold); }
    .auth-btn {
      padding: 12px 40px; background: var(--color-white);
      border: 1px solid var(--color-border); cursor: pointer;
      font-family: inherit; font-weight: 700; letter-spacing: 0.1em;
      transition: 0.3s;
    }
    .auth-btn:hover { border-color: var(--color-accent-gold); color: var(--color-accent-gold); }
    .auth-error { color: var(--color-accent-red); margin-top: 15px; font-weight: bold; }

    /* =========================================
       スクロールアニメーション（v-fade用）
    ========================================= */
    .v-fade-hidden {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .v-fade-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================================
       ヘッダー・ナビゲーション
    ========================================= */
    .header {
      background: var(--color-white);
      border-bottom: 2px solid var(--color-accent-gold);
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px; max-width: 1000px; margin: 0 auto;
    }
    .header-title { font-size: 1.3rem; margin: 0; white-space: nowrap; letter-spacing: 0.15em; }
    .header-title a:hover { color: var(--color-accent-gold); }
    
    .hamburger { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 6px; z-index: 101; padding: 5px; }
    .hamburger span { display: block; width: 24px; height: 2px; background-color: var(--color-text); transition: 0.3s; }
    .hamburger.is-active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .hamburger.is-active span:nth-child(2) { opacity: 0; }
    .hamburger.is-active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    .nav-menu {
      position: absolute; top: 100%; left: 0; width: 100%; background: var(--color-white);
      border-bottom: 1px solid var(--color-border); max-height: 0; overflow: hidden; transition: max-height 0.4s ease;
    }
    .nav-menu.is-open { max-height: 350px; }
    .nav-menu ul { list-style: none; padding: 0; margin: 0; }
    .nav-menu li a {
      display: block; padding: 15px 20px; border-top: 1px solid var(--color-border);
      font-weight: 700; font-size: 0.95rem; letter-spacing: 0.1em;
    }

    @media (min-width: 768px) {
      .hamburger { display: none; }
      .nav-menu { position: static; max-height: none; border-bottom: none; width: auto; }
      .nav-menu ul { display: flex; gap: 30px; }
      .nav-menu li a { border-top: none; padding: 5px 0; font-size: 1rem; }
      .nav-menu li a:hover { color: var(--color-accent-red); }
    }

    /* =========================================
       メインコンテンツ・コンテナ設定
    ========================================= */
    .main-content {
      padding: 50px 20px; min-height: 70vh;
    }
    .page-container {
      max-width: 800px; margin: 0 auto;
    }
    .rules-container {
      max-width: 1000px; margin: 0 auto;
    }
    
    .page-title { text-align: center; font-size: 1.8rem; color: var(--color-text); margin-bottom: 20px; letter-spacing: 0.2em; }
    .mizuhiki-line { width: 100%; height: 40px; background: url('MEOTO_logo_mizuhiki_line.svg') no-repeat center center; background-size: 100% auto; margin: 20px 0 40px 0; }

    /* =========================================
       TOPページ
    ========================================= */
    .hero { 
      margin-top: calc(5rem - 50px); margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw);
      margin-bottom: 50px; width: 100vw;
    }
    .hero-logo { width: 100%; height: 7rem; object-fit: cover; display: block; }
    @media (min-width: 768px) { .hero-logo { height: auto; object-fit: initial; } }
    .intro { text-align: center; }

    .btn-group { display: flex; flex-direction: column; gap: 15px; margin-top: 20px;}
    .btn {
      display: block; text-align: center; padding: 15px; background: var(--color-white);
      border: 1px solid var(--color-border); border-radius: 0; font-weight: 700;
      transition: 0.2s; letter-spacing: 0.1em;
    }
    .btn:hover { border-color: var(--color-accent-gold); color: var(--color-accent-gold); }
    
    .btn-entry { background: var(--color-white); color: var(--color-accent-red); border: 2px solid var(--color-accent-red); }
    .btn-entry:hover { background: var(--color-accent-red); color: var(--color-white); }
    
    @media (min-width: 768px) { .btn-group { flex-direction: row; justify-content: center; gap: 20px; } .btn { width: 220px; } }

    /* =========================================
       概要・ルール（共通）
    ========================================= */
    .event-section h3 { margin-top: 0; color: var(--color-text); font-size: 1.3rem; margin-bottom: 20px; letter-spacing: 0.15em; }
    
    .event-section h3.no-icon::before { content: ''; display: inline-block; width: 4px; height: 1em; background: var(--color-accent-gold); margin-right: 10px; vertical-align: -0.1em; }
    
    .round-icon {
      display: inline-block; width: 1.2em; height: 1.2em; vertical-align: -0.15em;
    }
    .icon-left { margin-right: 2px; }
    .icon-right { margin-right: 12px; }

    .event-section h4 {
      font-size: 1.1rem; color: var(--color-text); margin: 30px 0 10px; letter-spacing: 0.1em;
      border-bottom: 1px dashed var(--color-border); padding-bottom: 5px;
    }
    
    dl { margin-bottom: 15px; }
    dt { font-weight: 700; color: var(--color-accent-gold); letter-spacing: 0.1em; margin-top: 15px; margin-bottom: 5px; }
    dt:first-child { margin-top: 0; }
    dd { margin: 0 0 0 10px; }

    @media (min-width: 768px) { 
      dl { display: grid; grid-template-columns: 150px 1fr; gap: 15px 10px; }
      dt { margin: 0; }
      dd { margin: 0; }
    }
    
    .note { font-size: 0.85rem; color: var(--color-accent-red); margin-top: 15px; }
    
    .items-list { list-style: none; padding: 0; margin: 0; }
    .items-list li::before { content: '・'; margin-right: 4px; }
    .items-list li.no-dot::before { content: none; }

    /* =========================================
       ルールページ特有のレイアウト（PCで右側に図）
    ========================================= */
    .rules-layout {
      display: flex; flex-direction: column;
    }
    .rules-text { order: 1; }
    .rules-image { order: 2; margin-top: 60px; text-align: center; }
    .rules-image img { max-width: 100%; height: auto; }

    @media (min-width: 850px) {
      .rules-layout {
        flex-direction: row; gap: 50px; align-items: flex-start;
      }
      .rules-text { flex: 1; min-width: 0; }
      .rules-image {
        width: 320px; 
        flex-shrink: 0; margin-top: 0;
        position: sticky; top: 100px;
      }
    }

    /* =========================================
       ルールページ用：テーブルとスートバッジ
    ========================================= */
    .table-responsive { width: 100%; overflow-x: auto; margin: 15px 0 25px; }
    .rule-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    @media (min-width: 768px) { .rule-table { font-size: 0.95rem; } }
    .rule-table th, .rule-table td {
      border: 1px solid var(--color-border); padding: 10px; text-align: center; vertical-align: middle;
      white-space: nowrap; 
    }
    .rule-table th { background-color: #fcfcfc; font-weight: 700; color: var(--color-accent-gold); }

    .suit-badge {
      display: inline-block; border: 1px solid; padding: 1px 6px; margin: 2px 0;
      border-radius: 3px; background-color: var(--color-white); font-weight: 700;
      font-family: inherit; line-height: 1.3;
    }
    .badge-gold { color: var(--color-accent-gold); border-color: var(--color-accent-gold); }
    .badge-red { color: var(--color-accent-red); border-color: var(--color-accent-red); }

    /* =========================================
       作問者紹介
    ========================================= */
    .creator-name { display: flex; align-items: center; font-size: 1.4rem; color: var(--color-text); margin-top: 0; margin-bottom: 15px; letter-spacing: 0.15em; }
    /* ★ アイコンの右側に余白を追加 */
    .creator-name .round-icon { margin-right: 0.75rem; }
    
    .example-questions { margin-top: 25px; }
    .example-questions h4 { margin-bottom: 10px; font-size: 1.1rem; letter-spacing: 0.1em; }
    .example-questions ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--color-border); }
    .example-questions li { padding: 15px 0; border-bottom: 1px dashed var(--color-border); }
    
    .example-questions details { width: 100%; }
    .example-questions summary {
      cursor: pointer; position: relative; padding-left: 1.5em; outline: none; list-style: none;
    }
    .example-questions summary::-webkit-details-marker { display: none; }
    .example-questions summary::before {
      content: '▶'; position: absolute; left: 0; top: 0.25em; color: var(--color-accent-gold); font-size: 0.8em; transition: transform 0.2s ease;
    }
    .example-questions details[open] summary::before { transform: rotate(90deg); }
    
    .q-text { font-weight: 700; display: inline-block; line-height: 1.6; margin: 0; }
    .a-text { display: block; color: var(--color-accent-gold); font-weight: 700; margin-top: 10px; padding-left: 1.5em; }

    /* =========================================
       エントリー
    ========================================= */
    .entry-box { text-align: center; }
    .entry-date { font-size: 1.8rem; font-weight: 700; color: var(--color-accent-gold); letter-spacing: 0.15em; margin-bottom: 10px;}
    .attention-text { margin-top: 25px; font-weight: bold; border: 1px solid var(--color-accent-red); padding: 15px; display: inline-block; color: var(--color-accent-red); letter-spacing: 0.1em; line-height: 1.6;}

    /* =========================================
       プライバシーポリシー
    ========================================= */
    .policy-content h3 { font-size: 1.1rem; margin-top: 35px; margin-bottom: 10px; border-bottom: 1px dashed var(--color-border); padding-bottom: 5px; letter-spacing: 0.1em; color: var(--color-accent-gold); }
    .policy-content p { margin-bottom: 15px; }

    /* =========================================
       フッター
    ========================================= */
    .footer { background-color: var(--color-white); color: var(--color-text); padding: 40px 20px; text-align: center; font-size: 0.85rem; border-top: 2px solid var(--color-accent-gold); }
    .footer p { margin: 5px 0; }
    .footer-links { margin-top: 25px; display: flex; flex-direction: column; gap: 15px; }
    .footer-links a { color: var(--color-accent-gold); font-weight: 700; letter-spacing: 0.1em; }
    .footer-links a:hover { color: var(--color-text); }
    @media (min-width: 768px) { .footer-links { flex-direction: row; justify-content: center; gap: 40px; } }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    
    <!-- 準備中（パスワード）画面 -->
    <div v-if="!isAuth" class="auth-screen">
      <h2>準備中</h2>
      <p>プレビュー確認用のレビューコードを入力してください。</p>
      <input type="password" v-model="inputCode" class="auth-input" @keyup.enter="checkCode" placeholder="Code" />
      <button @click="checkCode" class="auth-btn">確認</button>
      <p v-if="authError" class="auth-error">コードが違います</p>
    </div>

    <!-- サイト本体（パスワード認証後） -->
    <div v-else>
      <header class="header">
        <div class="header-inner">
          <h1 class="header-title"><router-link to="/">Meoto杯</router-link></h1>
          <nav class="nav-menu" :class="{ 'is-open': isMenuOpen }">
            <ul>
              <li><router-link to="/" @click="closeMenu">TOP</router-link></li>
              <li><router-link to="/overview" @click="closeMenu">大会概要</router-link></li>
              <li><router-link to="/rules" @click="closeMenu">大会ルール</router-link></li>
              <li><router-link to="/creators" @click="closeMenu">作問者紹介</router-link></li>
              <li><router-link to="/entry" @click="closeMenu">エントリー</router-link></li>
            </ul>
          </nav>
          <button class="hamburger" @click="toggleMenu" :class="{ 'is-active': isMenuOpen }">
            <span></span><span></span><span></span>
          </button>
        </div>
      </header>

      <main class="main-content">
        <router-view></router-view>
      </main>

      <footer class="footer">
        <div>
          <p>Meoto杯：2027年1月24日(日) 文京シビックセンター区民会議室</p>
          <p>リハーサル：2027年1月9日(土) 松島コミュニティ会館</p>
          <p style="margin-top: 15px; font-size: 0.9em;">詳しくは<router-link to="/overview" style="color: var(--color-accent-gold); text-decoration: underline;">大会概要</router-link>をご覧ください</p>
          <div class="footer-links">
            <router-link to="/privacy">プライバシーポリシー</router-link>
            <a href="https://x.com/QuizMEOTOhai" target="_blank">公式X：@QuizMEOTOhai</a>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <!-- ======= 各ページのテンプレート ======= -->
  
  <template id="tmpl-home">
    <div class="page-container">
      <section class="hero" v-fade>
        <img src="MEOTO_logo_logo_long.svg" alt="Meoto杯ロゴ" class="hero-logo" />
      </section>
      
      <section class="intro" v-fade>
        <p>社会人スタートクイズプレーヤーの夫婦二組が、<br class="sp-br">自分たちの出したいものをたくさん詰め込んで<br class="sp-br">クイズ大会をお届けします。</p>
        <p>クイズを初めて間もないあなたも、<br class="sp-br">腕に覚えがあるあなたも、<br class="sp-br">ふるってご参加ください！</p>
      </section>
      
      <div class="mizuhiki-line" v-fade></div>

      <nav class="btn-group" v-fade>
        <router-link to="/overview" class="btn">大会概要へ</router-link>
        <router-link to="/creators" class="btn">作問者紹介へ</router-link>
        <router-link to="/entry" class="btn">エントリーはこちら</router-link>
      </nav>
    </div>
  </template>

  <template id="tmpl-overview">
    <div class="page-container">
      <h2 class="page-title" v-fade>大会概要</h2>
      <div class="mizuhiki-line" v-fade></div>
      
      <section class="event-section" v-fade>
        <h3 class="no-icon">両日程共通</h3>
        <dl>
          <dt>レギュレーション</dt>
          <dd>なし（個人戦です。夫婦でなくても参加可）</dd>
          
          <dt>当日の持ち物</dt>
          <dd>
            <ul class="items-list">
              <li>参加費</li>
              <li>スマートフォン（敗者復活戦で使用します）</li>
              <li class="no-dot">（・モバイルバッテリー）</li>
            </ul>
          </dd>
        </dl>
      </section>

      <div class="mizuhiki-line" v-fade></div>

      <section class="event-section" v-fade>
        <h3 class="no-icon">Meoto杯（本大会）</h3>
        <dl>
          <dt>開催日</dt><dd>2027年1月24日(日)</dd>
          <dt>時間</dt><dd>開場：10時 ／ 開始：10時30分 ／ 終了：18時（予定）</dd>
          <dt>参加費</dt><dd>1,000円（現金・PayPay）</dd>
          <dt>参加枠</dt><dd>48名</dd>
          <dt>会場</dt>
          <dd>
            文京シビックセンター区民会議室（東京都文京区）会議室C
            <div style="margin-top: 10px;">
              <iframe src="https://maps.google.co.jp/maps?output=embed&q=文京シビックセンター" width="100%" height="220" style="border:0; border-radius: 4px;" allowfullscreen loading="lazy"></iframe>
            </div>
          </dd>
          <dt>アクセス</dt><dd>東京メトロ「後楽園駅」/都営地下鉄「春日駅」徒歩1分<br>JR中央総武線「水道橋駅」徒歩9分</dd>
        </dl>
        <p class="note">※本大会の結果は、クイズイベント情報ポータルサイト「一心精進」様に掲載予定です。</p>
      </section>

      <div class="mizuhiki-line" v-fade></div>

      <section class="event-section" v-fade>
        <h3 class="no-icon">リハーサル</h3>
        <dl>
          <dt>開催日</dt><dd>2027年1月9日(土)</dd>
          <dt>時間</dt><dd>開場：10時 ／ 開始：10時30分 ／ 終了：18時（予定）</dd>
          <dt>参加費</dt><dd>500円（現金・PayPay）</dd>
          <dt>参加枠</dt><dd>24名</dd>
          <dt>会場</dt>
          <dd>
            松島コミュニティ会館（東京都江戸川区）和室
            <div style="margin-top: 10px;">
              <iframe src="https://maps.google.co.jp/maps?output=embed&q=江戸川区松島コミュニティ会館" width="100%" height="220" style="border:0; border-radius: 4px;" allowfullscreen loading="lazy"></iframe>
            </div>
          </dd>
          <dt>アクセス</dt><dd>JR総武線「新小岩駅」南口 徒歩10分</dd>
        </dl>
        <p class="note">※本大会と一部内容を変更して実施します。</p>
      </section>
    </div>
  </template>

  <template id="tmpl-rules">
    <div class="rules-container">
      <h2 class="page-title" v-fade>大会ルール</h2>
      <div class="mizuhiki-line" v-fade></div>

      <div class="rules-layout">
        
        <!-- 左側：テキストエリア -->
        <div class="rules-text">
          <section class="event-section" v-fade>
            <h3 class="no-icon">当日の流れ・ルール</h3>
            <p>受付終了後、参加者は48枚のカード（4種類のスート、1～12を使用）から1枚を引く。カードに書かれたスートを元に予選1st/2ndラウンドの組み分けを行う。</p>
          </section>

          <div class="mizuhiki-line" v-fade></div>

          <section class="event-section" v-fade>
            <h3>
              <img src="MEOTO_logo_icon-wan_gold.svg" alt="" class="round-icon icon-left">
              <img src="MEOTO_logo_icon-wan_red.svg" alt="" class="round-icon icon-right">
              予選 1st/2ndラウンド
            </h3>
            <p style="font-weight: bold;">3⚪︎2× ／ 32問限定 ／ 12名→6名 ／ 押し直しエンドレスチャンス</p>
            <p>メイン部屋とサブ部屋に分かれて進行する。作問者ごとに8問ずつ合計32問をランダムに出題する。<br>
            <span class="note">※サドンデスの作問者については、特に明示しない。（サドンデスに関しては以下同様）</span></p>

            <h4>セット終了時の判定</h4>
            <p>〇が多い順 → ×が少ない順 → 勝敗にかかわる場合：1〇1×サドンデス</p>
            <ul class="items-list">
              <li>7位以降の場合：最初に引いたカードの数字が大きい順。</li>
              <li>数字も同じ場合はエントリーが早い順。</li>
            </ul>

            <h4>組み分け</h4>
            <div class="table-responsive">
              <table class="rule-table">
                <tr>
                  <th></th>
                  <th>メイン部屋</th>
                  <th>サブ部屋</th>
                </tr>
                <tr>
                  <td><strong>1st-1</strong></td>
                  <td><span class="suit-badge badge-gold">♠1～12</span></td>
                  <td><span class="suit-badge badge-red">♡1～12</span></td>
                </tr>
                <tr>
                  <td><strong>1st-2</strong></td>
                  <td><span class="suit-badge badge-gold">♣1～12</span></td>
                  <td><span class="suit-badge badge-red">♢1～12</span></td>
                </tr>

  <script>
    const { createApp, ref } = Vue;
    const { createRouter, createWebHashHistory } = VueRouter;

          { text: '1998年12月28日に行われた『男達の別れ』ツアーファイナルがボーカル佐藤が出演した生前最後のライブとなった、代表曲に『ナイトクルージング』や『いかれたbaby』がある日本のロックバンドは何でしょう。', answer: 'フィッシュマンズ' }, 
          { text: '空気より水の方が熱伝導率が高いため、短時間で行えるというメリットがあるが、冷蔵庫で行うよりもドリップが出やすく味が落ちるというデメリットもある、食材の解凍方法は何でしょう。', answer: '流水解凍' } 
        ]
      },
      {
        name: 'サノ', 
        icon: 'MEOTO_logo_icon-wan_gold.svg',
        intro: '数学を活かすことで、生計を立てています。ヘルスケア系のデータ利活用に携わっています。数学科卒なので経歴的には理系ですが、小学生時代から三国志にハマっていた影響で歴史が好きです。といっても高校範囲、特に世界史のほとんどはクイズを始めてからのキャッチアップなのでまだまだですが、ヨーロッパ史とかもっとゆっくり学んでみたいなと思っています。長らくスポーツ観戦は野球一本槍でしたが、最近はW杯などの影響もありすっかりサッカーにハマり始めています。今回は好きなものを出しつつも、できるだけ幅広く面白いと思ったものを用意できればなと思っています。',
        questions: [ 
          { text: '本来は定義不能だが毎年開幕戦の日には尼崎中央3丁目商店街で阪神タイガースの143が"点灯"している、他チームの結果に関わらず自チームが優勝するために必要な勝利数のことを何というでしょう。', answer: 'マジックナンバー' },
          { text: '堪忍袋の緒、舌鼓、左うちわなど、よく耳にするがその現物を見たことがないものを扱うカタログの体をなす、2025年本屋大賞の超発掘本！に選ばれたクラフト・エヴィング商會の著書は何でしょう。', answer: '『ないもの、あります』' },
          { text: '「な」で0.1%、「なぜ」で1%、「なぜや」で99%答えは「ジョージ・マロリー」、と判断するように、新しい情報が得られるたびにある仮説の確率を更新し予測を行う統計学の手法は何でしょう。', answer: 'ベイズ推定' }

      },
      {

        intro: '（準備中）',
        questions: []

      {
        name: 'なかむー',
        icon: 'MEOTO_logo_icon-wan_red.svg',
        intro: '（準備中）',
        questions: []
      }
    ];

    const Home = { template: '#tmpl-home' };
    const Overview = { template: '#tmpl-overview' };
    const Rules = { template: '#tmpl-rules' };
    const Creators = { template: '#tmpl-creators', setup() { return { creators: creatorsData }; } };
    const Entry = { template: '#tmpl-entry' };
    const Privacy = { template: '#tmpl-privacy' };

    const router = createRouter({
      history: createWebHashHistory(),
      routes: [
        { path: '/', component: Home },
        { path: '/overview', component: Overview },
        { path: '/rules', component: Rules },
        { path: '/creators', component: Creators },
        { path: '/entry', component: Entry },
        { path: '/privacy', component: Privacy }
      ],
      scrollBehavior() { return { top: 0 }; } 
    });

    const app = createApp({
      setup() {
        const isMenuOpen = ref(false);
        const toggleMenu = () => isMenuOpen.value = !isMenuOpen.value;
        const closeMenu = () => isMenuOpen.value = false;
        
        const isAuth = ref(false);
        const inputCode = ref('');
        const authError = ref(false);

        if (sessionStorage.getItem('meoto_preview_auth') === 'true') {
          isAuth.value = true;
        }

        const checkCode = () => {
          if (inputCode.value === '2358') {
            isAuth.value = true;
            authError.value = false;
            sessionStorage.setItem('meoto_preview_auth', 'true');
          } else {
            authError.value = true;
          }
        };

        return { isMenuOpen, toggleMenu, closeMenu, isAuth, inputCode, authError, checkCode };
      }
    });

    app.directive('fade', {
      mounted(el) {
        el.classList.add('v-fade-hidden');
        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              el.classList.add('v-fade-visible');
              obs.unobserve(el);
            }
          });
        }, { threshold: 0.15 });
        observer.observe(el);
      }
    });

    app.use(router);
    app.mount('#app');
  </script>
